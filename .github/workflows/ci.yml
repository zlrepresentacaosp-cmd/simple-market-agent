name: CI

on:
  push:
    branches: ["main", "infra-ci-package-manager"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to validate"
        required: true
        default: "infra-ci-package-manager"
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.target_branch }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_branch || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ (inputs.target_branch || github.ref_name) == 'infra-ci-package-manager' && '22.x' || '20.x' }}

      - name: Install dependencies
        run: |
          if [ "${{ inputs.target_branch || github.ref_name }}" = "infra-ci-package-manager" ]; then
            npm ci
          else
            npm install
          fi

      - name: Apply SQLite migrations
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
